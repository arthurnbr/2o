# Push a tag vX.Y.Z → tests, then a GitHub release with `make dist` assets.
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Latest Go: releases ship with its fixes, and nfpm (deb/rpm) needs >= 1.26.4.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - name: Build release assets
        run: make dist VERSION="$GITHUB_REF_NAME" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "2o $GITHUB_REF_NAME" --generate-notes
