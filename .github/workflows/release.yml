# Push a tag vX.Y.Z → tests, then a GitHub release with `make dist` assets.
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Latest Go: releases ship with its fixes, and nfpm (deb/rpm) needs >= 1.26.4.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - name: Build release assets
        run: |
          set -o pipefail
          make dist VERSION="$GITHUB_REF_NAME" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" 2>&1 | tee dist.log
      - name: Report build failure
        if: failure()
        # One annotation (GitHub keeps 10 per step), newlines encoded as %0A.
        run: |
          msg=$(grep -v '^go: downloading' dist.log | tail -n 25 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')
          echo "::error title=make dist failed::$msg"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "2o $GITHUB_REF_NAME" --generate-notes
